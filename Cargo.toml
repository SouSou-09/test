[package]
name = "photon3d"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "A realtime physically based 3D engine written in Rust"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
env_logger = "0.11"
glam = { version = "0.30", features = ["bytemuck"] }
gltf = "1"
log = "0.4"
pollster = "0.4"
rayon = "1.11"
wgpu = "30.0.2"
winit = "0.30.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = true
